$font = Adwaita Sans

background {
    monitor =
    path = @WALLPAPER@
    color = rgb(1c192b)
    blur_passes = 3
    blur_size = 5
    brightness = 0.65
}

label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 72
    color = rgb(f2e8f5)
    position = 0, 112
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    font_family = $font
    font_size = 20
    color = rgb(dbc4f6)
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    rounding = 14
    outline_thickness = 2
    inner_color = rgba(2a243bf2)
    outer_color = rgb(dbc4f6) rgb(f2bd9b) 45deg
    check_color = rgb(b9d8e8)
    fail_color = rgb(f4adc1)
    font_color = rgb(f2e8f5)
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL$FPRINTFAIL
    fade_on_empty = false
    position = 0, -36
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT
    font_family = $font
    font_size = 13
    color = rgb(c9b9da)
    onclick = hyprctl switchxkblayout all next
    position = 0, -90
    halign = center
    valign = center
}
