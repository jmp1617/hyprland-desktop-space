$locked = hyprctl locked | grep -qx true
$displayOff = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
$displayOn = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

# Five idle minutes after a manual lock, or after waking the lock screen.
listener {
    timeout = 300
    condition_cmd = $locked
    ignore_inhibit = true
    on-timeout = $displayOff
    on-resume = $displayOn
}

listener {
    timeout = 1800
    on-timeout = pidof -q hyprlock || hyprlock --grace 0
}

# Idle timers count from the last input. Automatic lock happens at minute 30.
listener {
    timeout = 2100
    condition_cmd = $locked
    ignore_inhibit = true
    on-timeout = $displayOff
    on-resume = $displayOn
}
